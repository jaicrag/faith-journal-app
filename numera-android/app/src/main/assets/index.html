<script>
(()=>{'use strict';
const STORAGE='numera_data_v1';const COLORS=['#0A91A3','#315FB7','#8B5BCB','#D78A38','#D05774','#268B6B','#C09B3C','#657D96','#EA6956','#4249A5'];function itemColor(i,n=0){return COLORS.includes(i?.color)?i.color:COLORS[n%COLORS.length]}function pickerColor(i){return `<div class="field"><label>Color del contador</label><div class="color-picker" role="group" aria-label="Seleccionar color">${COLORS.map((color,n)=>`<label class="color-option" title="Color ${n+1}"><input type="radio" name="color" value="${color}" ${color===itemColor(i,0)?'checked':''} required><span class="color-swatch" style="--swatch:${color}">${icon('check')}</span></label>`).join('')}</div><p class="hint">El color se guarda con este contador y aparece también en sus gráficas.</p></div>`}const TYPES={libre:{title:'Contador libre',icon:'hash',items:['Contador principal'],detail:'Registra cualquier cantidad rápidamente.'},asistencia:{title:'Asistencia',icon:'users',items:['Adultos','Jóvenes','Niños','Visitantes'],detail:'Categorías independientes para contar asistentes.'},votacion:{title:'Votación',icon:'vote',items:['Opción A','Opción B','Votos nulos','Abstenciones'],detail:'Cuenta opciones y distingue votos nulos y abstenciones.'},inventario:{title:'Inventario',icon:'boxes',items:['Artículo A','Artículo B'],detail:'Control de existencias por artículo.'},encuesta:{title:'Encuesta',icon:'list',items:['Respuesta A','Respuesta B','Respuesta C'],detail:'Registra respuestas y compara porcentajes.'}};
const I={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',hash:'<path d="M4 9h16M4 15h16M11 4 7 20M17 4l-4 16"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',vote:'<path d="m9 12 2 2 4-4M3 17h18l-2 4H5l-2-4ZM7 17 6 3h12l-1 14"/>',boxes:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',chart:'<path d="M3 3v18h18M7 17v-5M12 17V7M17 17v-9"/>',settings:'<path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',back:'<path d="m15 18-6-6 6-6"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-4 4 4-4 4 4M4 7V3h16v4"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="m4 20 5-.9L20 7l-4-4L5 15l-1 5ZM14 5l4 4"/>',trash:'<path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',undo:'<path d="M3 7v6h6M3 13a9 9 0 1 1 2 5"/>',redo:'<path d="M21 7v6h-6M21 13a9 9 0 1 0-2 5"/>',file:'<path d="M5 2h10l5 5v15H5zM15 2v5h5M9 13h7M9 17h7"/>',lock:'<rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9 6.3 6.3M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',reset:'<path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 1.4-3.4 2 2 0 0 1 1.4-3.4H19a2 2 0 0 0 2-2A9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="12" r=".5"/><circle cx="10" cy="7.5" r=".5"/><circle cx="16" cy="8.5" r=".5"/>'};
function icon(n){return `<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]||I.hash}</svg>`}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uid(){return(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():('n'+Date.now().toString(36)+Math.random().toString(36).slice(2))}function fmt(n){return Number(n||0).toLocaleString('es-MX')}function shortDate(v){return new Date(v).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}function when(v){return new Date(v).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}function initial(){return {version:1,preferences:{dark:false,haptics:true,step:1},projects:[]}};
let db;try{const r=localStorage.getItem(STORAGE);db=r?JSON.parse(r):initial();if(!db||db.version!==1||!Array.isArray(db.projects))throw Error('Formato no compatible')}catch(e){db=initial();try{if(localStorage.getItem(STORAGE))alert('No se pudieron leer los datos guardados. Exporta un respaldo si aún los conservas.');}catch(x){}}
let view='home',currentProjectId=null,currentSessionId=null,modal='',search='',filterProject='',toastTimer=null,formType='libre';const app=document.getElementById('app');
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Puede ser falta de espacio o bloqueo de almacenamiento. Exporta tus datos.');return false}}function vibrate(){if(db.preferences.haptics&&navigator.vibrate)navigator.vibrate(12)}function notify(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2600)}
function project(){return db.projects.find(p=>p.id===currentProjectId)}function session(p=project()){return p?.sessions.find(s=>s.id===currentSessionId)||p?.sessions.at(-1)}function eventsTotal(s){return(s?.events||[]).reduce((sum,e)=>sum+e.delta,0)}function countItem(s,id){return(s?.events||[]).reduce((sum,e)=>sum+(e.itemId===id?e.delta:0),0)}function allProjectCount(p){return p.sessions.reduce((sum,s)=>sum+eventsTotal(s),0)}function currentCounts(p,s){return p.items.map(item=>({item,count:countItem(s,item.id)}))}function pct(n,total){return total?Math.round(100*n/total):0}function specialTotal(p,s){if(p.type==='votacion'){return currentCounts(p,s).filter(c=>!/abstenc/i.test(c.item.name)).reduce((x,c)=>x+c.count,0)}return eventsTotal(s)}
function navButton(tab,label,sym){return `<button class="nav-btn ${view===tab?'active':''}" data-action="nav" data-tab="${tab}">${icon(sym)}<span>${label}</span></button>`}function chrome(content){document.body.classList.toggle('dark',!!db.preferences.dark);app.innerHTML=`<div class="app-layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><span class="brand-glint">NÚMERA</span></div><div class="side-label">ESPACIO DE TRABAJO</div><div class="side-links">${navButton('home','Mis proyectos','grid')}${navButton('detail','Contadores','hash')}${navButton('reports','Estadísticas','chart')}${navButton('history','Historial','history')}${navButton('settings','Configuración','settings')}</div><div class="side-foot">NÚMERA · VERSIÓN 1.1<br/>Conteo local, privado y sin anuncios</div></aside><main class="main">${content}</main><nav class="mobilebar">${navButton('home','Proyectos','grid')}${navButton('detail','Contar','hash')}${navButton('reports','Informes','chart')}${navButton('history','Historial','history')}${navButton('settings','Ajustes','settings')}</nav></div>${modal?renderModal():''}`;}
function header(kicker,title,sub,actions=''){return `<div class="topline"><div><div class="eyebrow">${esc(kicker)}</div><h1 class="page-title">${esc(title)}</h1>${sub?`<p class="subtitle">${esc(sub)}</p>`:''}</div><div class="top-actions">${actions}</div></div>`}const addBtn=`<button class="btn" data-action="open-create">${icon('plus')} Nuevo proyecto</button>`;
function home(){const count=db.projects.length,allSessions=db.projects.reduce((n,p)=>n+p.sessions.length,0),allEvents=db.projects.reduce((n,p)=>n+p.sessions.reduce((a,s)=>a+s.events.filter(e=>e.kind==='count').length,0),0);const projects=db.projects.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));chrome(`${header('TU ESPACIO DE CONTEO','Todo bajo control','Organiza, registra y consulta cada conteo desde un solo lugar.',addBtn)}<div class="dash-stats"><div class="card metric"><div class="metric-label">Proyectos</div><div class="metric-value">${fmt(count)}</div><div class="metric-note">Organizados</div></div><div class="card metric"><div class="metric-label">Sesiones</div><div class="metric-value">${fmt(allSessions)}</div><div class="metric-note">Registradas</div></div><div class="card metric"><div class="metric-label">Operaciones</div><div class="metric-value">${fmt(allEvents)}</div><div class="metric-note">Conteos originales</div></div></div><div class="section-head"><h2>Mis proyectos</h2>${count?`<input class="input search" id="search" placeholder="Buscar proyecto..." value="${esc(search)}" aria-label="Buscar proyecto">`:''}</div>${count?`<div class="project-grid">${projects.map(p=>{const s=p.sessions.at(-1),n=specialTotal(p,s);return `<button class="card project" data-action="open-project" data-id="${p.id}"><div class="project-top"><span class="project-icon">${icon(TYPES[p.type].icon)}</span><span class="pill ${!s?.closed?'green':''}">${s?.closed?'Finalizada':'Activa'}</span></div><div><div class="project-count">${fmt(n)}</div><h3>${esc(p.name)}</h3><div class="project-sub">${TYPES[p.type].title} · ${p.sessions.length} ${p.sessions.length===1?'sesión':'sesiones'}</div></div></button>`}).join('')}</div>${!projects.length?'<div class="empty"><p>No encontramos proyectos con ese nombre.</p></div>':''}`:`<div class="empty"><div class="empty-icon">${icon('grid')}</div><h2>Crea tu primer proyecto</h2><p>Para empezar, elige qué quieres contar: asistencia, votos, inventario, respuestas o un contador libre. No incluimos datos de ejemplo.</p>${addBtn}</div>`}`)}
function detail(){const p=project();if(!p){view='home';return home()}const s=session(p);currentSessionId=s?.id;const cnt=currentCounts(p,s),total=specialTotal(p,s),locked=s.closed,possibleUndo=(s.undoStack||[]).length>0,possibleRedo=(s.redoStack||[]).length>0;chrome(`<button class="crumb" data-action="nav" data-tab="home">${icon('back')} Volver a proyectos</button><div class="proj-top"><div><div class="eyebrow">${TYPES[p.type].title.toUpperCase()}</div><h1 class="page-title">${esc(p.name)}</h1><div class="pills"><span class="pill">${icon(TYPES[p.type].icon)} ${TYPES[p.type].title}</span><span class="pill">${p.items.length} categorías</span><span class="pill">${p.sessions.length} sesiones</span></div></div><div class="top-actions"><button class="btn outline iconbtn" title="Editar proyecto" data-action="edit-project">${icon('edit')}</button><button class="btn outline iconbtn" title="Exportar conteo CSV" data-action="export-csv">${icon('download')}</button></div></div><div class="card sessionbar"><div class="session-meta"><span class="pulse ${locked?'closed':''}"></span><div><strong>${esc(s.name)}</strong><small>${shortDate(s.startedAt)} · ${locked?'Sesión cerrada':'Sesión en curso'}</small></div></div><div class="row"><select class="input inline-select" id="select-session" aria-label="Cambiar sesión">${p.sessions.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn outline small" data-action="new-session">${icon('plus')} Sesión</button></div></div><div class="card counter-hero"><div class="hero-row"><div><div class="hero-caption">${p.type==='votacion'?'TOTAL DE VOTOS EMITIDOS':'TOTAL DE LA SESIÓN'}</div><div class="hero-total">${fmt(total)}</div><div class="hero-sub">${p.type==='votacion'?`Participaciones incl. abstenciones: ${fmt(eventsTotal(s))}`:`${cnt.length} contadores · ${s.events.length} movimientos registrados`}</div></div><span style="color:#48c9b7">${icon('chart')}</span></div>${p.goal>0?`<div class="goalbar"><span style="width:${Math.max(0,Math.min(100,pct(total,p.goal)))}%"></span></div><div class="hero-sub">${fmt(total)} de ${fmt(p.goal)} (${pct(total,p.goal)}% de la meta)</div>`:''}</div><div class="section-head"><h2>Contadores</h2><div class="row"><button class="btn outline small" data-action="undo" ${locked||!possibleUndo?'disabled':''} title="Deshacer última pulsación">${icon('undo')} <span class="hide-mobile">Deshacer</span></button><button class="btn outline small" data-action="redo" ${locked||!possibleRedo?'disabled':''} title="Rehacer">${icon('redo')}</button><button class="btn small" data-action="add-item">${icon('plus')} Añadir</button></div></div>${p.type==='libre'&&cnt.length===1?`<div class="card largecount" style="padding:22px;--item-accent:${itemColor(cnt[0].item)}"><div class="count-name"><span class="count-dot" style="background:${itemColor(cnt[0].item)}"></span>${esc(cnt[0].item.name)}</div><div class="count-value">${fmt(cnt[0].count)}</div><div class="count-controls"><button class="tap-btn" data-action="change" data-id="${cnt[0].item.id}" data-delta="-1" aria-label="Restar uno" ${locked||cnt[0].count===0?'disabled':''}>${icon('minus')}</button><button class="tap-btn plus" style="min-width:200px" data-action="change" data-id="${cnt[0].item.id}" data-delta="1" aria-label="Sumar uno" ${locked?'disabled':''}>${icon('plus')} <span style="font-size:15px;margin-left:8px;font-weight:750">Contar</span></button></div><div class="largecount-tools"><button class="reset-btn" data-action="reset-item" data-id="${cnt[0].item.id}" ${locked||cnt[0].count===0?'disabled':''}>${icon('reset')} Poner en cero</button><button class="reset-btn" data-action="edit-item" data-id="${cnt[0].item.id}">${icon('palette')} Personalizar color</button></div></div>`:`<div class="counter-grid">${cnt.map((c,i)=>`<div class="card count-card" style="--item-accent:${itemColor(c.item,i)}"><div class="count-head"><div class="count-name"><span class="count-dot" style="background:${itemColor(c.item,i)}"></span>${esc(c.item.name)}</div><button class="microbtn" title="Editar categoría" data-action="edit-item" data-id="${c.item.id}">${icon('dots')}</button></div><div class="count-value">${fmt(c.count)}</div><div class="count-bottom"><div class="edit-panel"><span class="count-fraction">${pct(c.count,total)}% del total</span><button class="reset-btn" data-action="reset-item" data-id="${c.item.id}" ${locked||c.count===0?'disabled':''}>${icon('reset')} A cero</button></div><div class="count-controls"><button class="tap-btn" data-action="change" data-id="${c.item.id}" data-delta="-1" aria-label="Restar uno a ${esc(c.item.name)}" ${locked||c.count===0?'disabled':''}>${icon('minus')}</button><button class="tap-btn plus" data-action="change" data-id="${c.item.id}" data-delta="1" aria-label="Sumar uno a ${esc(c.item.name)}" ${locked?'disabled':''}>${icon('plus')}</button></div></div></div>`).join('')}</div>`}<div class="section-head"><h2>Administración</h2></div><div class="project-menu"><button class="btn outline small" data-action="history-current">${icon('history')} Ver historial</button><button class="btn outline small" data-action="change-step">${icon('settings')} Paso: ${db.preferences.step}</button><button class="btn outline small" data-action="close-session" ${locked?'disabled':''}>${icon('lock')} ${locked?'Sesión cerrada':'Cerrar sesión'}</button></div><p class="statusline" style="margin-top:13px">${p.type==='votacion'?'Este registro es un contador manual, no un sistema de votación certificado. Los cambios se registran para su revisión.':p.type==='asistencia'?'Para que el total sea correcto, cuenta cada persona en una sola categoría.':''}</p>`)}
function history(){const p=project();const s=session(p);if(!p){view='home';return home()}const items=[...s.events].reverse();chrome(`${header('TRAZABILIDAD','Historial de movimientos',`${esc(p.name)} · ${esc(s.name)}`,`<button class="btn outline" data-action="export-csv">${icon('download')} Exportar CSV</button>`)}<div class="section-head"><h2>${items.length} movimientos registrados</h2><button class="btn outline small" data-action="detail-current">${icon('back')} Contadores</button></div>${items.length?`<div class="card history-card">${items.map(e=>{const it=p.items.find(i=>i.id===e.itemId);return `<div class="history-item"><div class="history-icon ${e.delta<0?'down':''}">${e.delta<0?icon('minus'):icon('plus')}</div><div class="history-main"><strong>${esc(it?.name||'Categoría eliminada')}</strong><span>${when(e.ts)} · ${e.kind==='reset'?'Reinicio a cero':e.kind==='undo'?'Deshacer':e.kind==='redo'?'Rehacer':e.delta<0?'Corrección / disminución':'Conteo'}</span></div><span class="delta ${e.delta<0?'down':''}">${e.delta>0?'+':''}${fmt(e.delta)}</span></div>`}).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('history')}</div><h2>Sin movimientos</h2><p>Los registros aparecerán aquí en cuanto empieces a contar.</p></div>`}`)}
function reports(){const p=project();if(!p){view='home';return home()}const s=session(p),cnt=currentCounts(p,s),total=specialTotal(p,s),max=Math.max(1,...cnt.map(x=>x.count));chrome(`${header('ANÁLISIS DE DATOS','Estadísticas y resultados',`${esc(p.name)} · ${esc(s.name)}`,`<button class="btn outline" data-action="export-csv">${icon('download')} Exportar CSV</button>`)}<div class="dash-stats"><div class="card metric"><div class="metric-label">Total sesión</div><div class="metric-value">${fmt(total)}</div><div class="metric-note">Registros netos</div></div><div class="card metric"><div class="metric-label">Categorías</div><div class="metric-value">${cnt.length}</div><div class="metric-note">Dentro del proyecto</div></div><div class="card metric"><div class="metric-label">Sesiones</div><div class="metric-value">${p.sessions.length}</div><div class="metric-note">Total de periodos</div></div></div><div class="twocol"><div class="card panelpad"><h2 style="margin-bottom:25px">Distribución por categoría</h2><div class="barchart">${cnt.map((x,i)=>`<div class="barline"><span class="barname" title="${esc(x.item.name)}">${esc(x.item.name)}</span><span class="bartrack"><span class="barfill" style="display:block;width:${100*x.count/max}%;background:${itemColor(x.item,i)}"></span></span><span class="barval">${fmt(x.count)} (${pct(x.count,total)}%)</span></div>`).join('')}</div></div><div class="card panelpad"><h2 style="margin-bottom:22px">Sesiones del proyecto</h2><div class="barchart">${p.sessions.map(x=>`<div class="barline"><span class="barname" title="${esc(x.name)}">${esc(x.name)}</span><span class="bartrack"><span class="barfill" style="display:block;width:${100*eventsTotal(x)/Math.max(1,...p.sessions.map(y=>eventsTotal(y)))}%"></span></span><span class="barval">${fmt(eventsTotal(x))}</span></div>`).join('')}</div><hr class="sep" style="margin:25px 0 15px"/><p class="statusline">Los resultados corresponden a registros guardados en este dispositivo. Puedes respaldarlos desde Configuración.</p></div></div>`)}
function settings(){chrome(`${header('PREFERENCIAS','Configuración','Personaliza la experiencia y protege tus datos.')}<div class="settings-grid"><div class="card settings-tile"><span class="project-icon">${icon('sun')}</span><h3>Apariencia y respuesta</h3><p>Activa el tema oscuro y confirma cada pulsación con vibración, cuando el dispositivo lo permita.</p><div class="edit-panel"><label class="settings-check"><input type="checkbox" id="darkCheck" ${db.preferences.dark?'checked':''}/> Tema oscuro</label><label class="settings-check"><input type="checkbox" id="hapticCheck" ${db.preferences.haptics?'checked':''}/> Respuesta háptica</label></div></div><div class="card settings-tile"><span class="project-icon">${icon('download')}</span><h3>Copia de seguridad</h3><p>Respaldo portable de todos tus proyectos, sesiones e historiales en formato JSON. No se sube información a servidores.</p><div class="row" style="flex-wrap:wrap"><button class="btn small" data-action="export-json">${icon('download')} Respaldar</button><button class="btn outline small" data-action="import-json">${icon('upload')} Restaurar</button></div></div><div class="card settings-tile"><span class="project-icon">${icon('file')}</span><h3>Exportación de datos</h3><p>Exporta los movimientos del contador seleccionado a CSV, compatible con Excel y hojas de cálculo.</p><button class="btn outline small" data-action="export-csv" ${!project()?'disabled':''}>${icon('download')} Exportar CSV</button></div><div class="card settings-tile"><span class="project-icon">${icon('lock')}</span><h3>Privacidad y conservación</h3><p>Los registros quedan en el almacenamiento de esta app o navegador. Para cambiar de dispositivo, crea una copia de seguridad y restáurala.</p><span class="pill green">${icon('check')} Funciona sin conexión</span></div></div><div class="help" style="margin-top:20px">NÚMERA 1.1 · Datos locales, sin publicidad y sin cuentas. En modo de archivo HTML, la permanencia de los datos depende de la configuración de almacenamiento del navegador: crea respaldos periódicos.</div>`)}
function renderModal(){const p=project(),s=session(p);if(modal==='create')return `<div class="sheet-backdrop" data-action="close-modal-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Nuevo proyecto</h2><button class="btn ghost iconbtn" data-action="close-modal">${icon('close')}</button></div><p class="sheet-desc">Elige un modo de conteo. Podrás modificar categorías y realizar tantas sesiones como necesites.</p><form id="create-form"><div class="field"><label for="project-name">Nombre del proyecto</label><input class="input" id="project-name" name="name" maxlength="70" placeholder="Ej. Reunión de octubre" required autofocus></div><div class="field"><label>Tipo de conteo</label><div class="type-list">${Object.entries(TYPES).map(([key,t])=>`<button type="button" class="type-choice ${key===formType?'selected':''}" data-action="pick-type" data-type="${key}">${icon(t.icon)} ${t.title}</button>`).join('')}</div><p class="hint">${TYPES[formType].detail}</p></div><div class="field"><label for="project-goal">Meta opcional</label><input class="input" id="project-goal" name="goal" type="number" min="0" max="100000000" step="1" placeholder="Sin meta"></div><div class="sheet-actions"><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button class="btn" type="submit">Crear proyecto</button></div></form></div></div>`;
if(modal==='add-item'||modal==='edit-item'){const item=modal==='edit-item'?p.items.find(x=>x.id===filterProject):null;return `<div class="sheet-backdrop" data-action="close-modal-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>${item?'Editar categoría':'Añadir categoría'}</h2><button class="btn ghost iconbtn" data-action="close-modal">${icon('close')}</button></div><p class="sheet-desc">Personaliza el nombre y el color de este contador. Todos sus movimientos permanecen en el historial.</p><form id="item-form"><div class="field"><label for="item-name">Nombre</label><input id="item-name" name="name" class="input" required maxlength="60" value="${esc(item?.name||'')}" placeholder="Ej. Adultos" autofocus></div>${pickerColor(item)}<div class="sheet-actions">${item?`<button class="btn danger" type="button" data-action="delete-item">Eliminar</button>`:''}<button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form></div></div>`}
if(modal==='new-session')return `<div class="sheet-backdrop" data-action="close-modal-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Nueva sesión</h2><button class="btn ghost iconbtn" data-action="close-modal">${icon('close')}</button></div><p class="sheet-desc">Crea un periodo independiente. Las sesiones previas y sus registros no se perderán.</p><form id="session-form"><div class="field"><label>Nombre de la sesión</label><input class="input" name="name" required maxlength="70" value="Sesión ${p.sessions.length+1}" autofocus></div><div class="sheet-actions"><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn">Crear sesión</button></div></form></div></div>`;
if(modal==='edit-project')return `<div class="sheet-backdrop" data-action="close-modal-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Editar proyecto</h2><button class="btn ghost iconbtn" data-action="close-modal">${icon('close')}</button></div><form id="project-form"><div class="field"><label>Nombre</label><input class="input" name="name" required maxlength="70" value="${esc(p.name)}"></div><div class="field"><label>Meta</label><input class="input" name="goal" type="number" min="0" step="1" max="100000000" value="${p.goal||0}"></div><div class="sheet-actions"><button type="button" class="btn danger" data-action="delete-project">Eliminar</button><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form></div></div>`;
if(modal==='step')return `<div class="sheet-backdrop" data-action="close-modal-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>Paso de conteo</h2><button class="btn ghost iconbtn" data-action="close-modal">${icon('close')}</button></div><p class="sheet-desc">Cada pulsación sumará o restará esta cantidad. Para votos y encuestas recomendamos paso 1.</p><form id="step-form"><div class="field"><label>Unidades por pulsación</label><input name="step" class="input" type="number" min="1" max="1000000" required value="${db.preferences.step}"></div><div class="sheet-actions"><button class="btn" type="submit">Guardar</button></div></form></div></div>`;
return ''}
function render(){if(view==='home')home();else if(view==='detail')detail();else if(view==='history')history();else if(view==='reports')reports();else settings()}
function create(){const name=document.querySelector('#project-name').value.trim();if(!name)return;const g=Number(document.querySelector('#project-goal').value||0);if(!Number.isSafeInteger(g)||g<0||g>100000000)return notify('Meta inválida');const now=new Date().toISOString();const p={id:uid(),name,type:formType,createdAt:now,goal:g,items:TYPES[formType].items.map((name,i)=>({id:uid(),name,color:COLORS[i%COLORS.length]})),sessions:[{id:uid(),name:'Sesión 1',startedAt:now,closedAt:null,events:[],undoStack:[],redoStack:[]}]};db.projects.unshift(p);currentProjectId=p.id;currentSessionId=p.sessions[0].id;view='detail';modal='';persist();render();notify('Proyecto creado')}
function change(itemId,dir){const p=project(),s=session(p);if(!p||!s||s.closed)return;const item=p.items.find(x=>x.id===itemId);if(!item)return;const delta=Number(dir)*db.preferences.step;if(delta<0&&countItem(s,itemId)+delta<0){notify('El contador no puede ser negativo');return}const ev={id:uid(),itemId,delta,ts:new Date().toISOString(),kind:'count'};s.events.push(ev);s.undoStack.push(ev.id);s.redoStack=[];persist();vibrate();render()}
function resetItem(itemId){const p=project(),s=session(p);if(!p||!s||s.closed)return;const item=p.items.find(x=>x.id===itemId);if(!item)return;const previous=countItem(s,itemId);if(previous<=0)return notify('Este contador ya está en cero');if(!confirm('¿Poner «'+item.name+'» en cero? Se conservará el historial y podrás deshacerlo.'))return;const ev={id:uid(),itemId,delta:-previous,ts:new Date().toISOString(),kind:'reset'};s.events.push(ev);s.undoStack.push(ev.id);s.redoStack=[];persist();vibrate();render();notify('Contador reiniciado a cero')}
function undo(){const s=session();if(!s||s.closed||!s.undoStack.length)return;const id=s.undoStack.pop(),ev=s.events.find(x=>x.id===id);if(!ev)return;const rev={id:uid(),itemId:ev.itemId,delta:-ev.delta,ts:new Date().toISOString(),kind:'undo'};s.events.push(rev);s.redoStack.push(id);persist();render();notify('Movimiento deshecho')}
function redo(){const s=session();if(!s||s.closed||!s.redoStack.length)return;const id=s.redoStack.pop(),ev=s.events.find(x=>x.id===id);if(!ev)return;if(ev.delta<0&&countItem(s,ev.itemId)+ev.delta<0)return notify('No se puede rehacer esta reducción');const again={id:uid(),itemId:ev.itemId,delta:ev.delta,ts:new Date().toISOString(),kind:'redo'};s.events.push(again);s.undoStack.push(again.id);persist();render();notify('Movimiento rehecho')}
function exportFile(name,body,mime){const b=new Blob([body],{type:mime});if(window.Android&&typeof window.Android.saveFile==='function'){const reader=new FileReader();reader.onload=()=>window.Android.saveFile(name,String(reader.result).split(',')[1],mime);reader.readAsDataURL(b);return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)}function exportJSON(){exportFile('Numera-respaldo-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');notify('Respaldo generado')}
function csvEscape(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}function exportCSV(){const p=project(),s=session(p);if(!p||!s)return notify('Abre primero un proyecto');const lines=[['Proyecto','Tipo','Sesión','Fecha y hora','Categoría','Cantidad','Movimiento']];s.events.forEach(e=>lines.push([p.name,TYPES[p.type].title,s.name,when(e.ts),p.items.find(x=>x.id===e.itemId)?.name||'Sin categoría',e.delta,e.kind]));lines.push([]);lines.push(['Totales por categoría']);p.items.forEach(i=>lines.push([i.name,countItem(s,i.id)]));const csv='\ufeff'+lines.map(row=>row.map(csvEscape).join(',')).join('\r\n');exportFile('Numera-'+p.name.replace(/[^a-z0-9-]/gi,'-').slice(0,35)+'-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8');notify('CSV generado')}
function validateImport(data){if(!data||data.version!==1||!Array.isArray(data.projects)||data.projects.length>20000)throw Error('Respaldo no compatible');const ids=new Set();for(const p of data.projects){if(!p||typeof p.id!=='string'||ids.has(p.id)||!TYPES[p.type]||typeof p.name!=='string'||p.name.length>200||!Array.isArray(p.items)||!p.items.length||p.items.length>5000||!Array.isArray(p.sessions)||!p.sessions.length||p.sessions.length>10000)throw Error('Proyectos inválidos');ids.add(p.id);const items=new Set();for(const i of p.items){if(typeof i.id!=='string'||items.has(i.id)||typeof i.name!=='string'||i.name.length>200)throw Error('Categoría inválida');items.add(i.id);i.color=COLORS.includes(i.color)?i.color:COLORS[p.items.indexOf(i)%COLORS.length]}for(const s of p.sessions){if(!s||!Array.isArray(s.events)||s.events.length>300000||typeof s.id!=='string'||typeof s.name!=='string')throw Error('Sesión inválida');for(const e of s.events){if(!e||!items.has(e.itemId)||!Number.isSafeInteger(e.delta)||!Number.isFinite(Date.parse(e.ts)))throw Error('Movimiento inválido')}s.undoStack=Array.isArray(s.undoStack)?s.undoStack:[];s.redoStack=Array.isArray(s.redoStack)?s.redoStack:[]}}
return {version:1,projects:data.projects,preferences:{dark:!!data.preferences?.dark,haptics:data.preferences?.haptics!==false,step:Number.isInteger(data.preferences?.step)&&data.preferences.step>0&&data.preferences.step<1000001?data.preferences.step:1}}}
const imp=document.getElementById('importFile');function restoreContent(content){const data=validateImport(JSON.parse(content));if(!confirm('¿Reemplazar todos los proyectos y datos actuales por este respaldo? Esta operación no se puede deshacer.'))return;db=data;currentProjectId=null;currentSessionId=null;view='home';search='';persist();render();notify('Respaldo restaurado correctamente')}window.importBackupBase64=function(encoded){try{if(encoded.length>28*1024*1024)throw Error('Archivo demasiado grande');const binary=atob(encoded);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));restoreContent(new TextDecoder().decode(bytes))}catch(e){alert('No se pudo restaurar el respaldo: '+e.message)}};imp.addEventListener('change',async()=>{const f=imp.files?.[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('Archivo demasiado grande');restoreContent(await f.text())}catch(e){alert('No se pudo restaurar el respaldo: '+e.message)}finally{imp.value=''}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;const id=b.dataset.id;if(action==='close-modal-bg'){if(e.target===b){modal='';render()}return}if(action==='nav'){if(b.dataset.tab==='detail'&&!project()){view='home';render();notify('Selecciona o crea un proyecto');return}if(['reports','history'].includes(b.dataset.tab)&&!project()){view='home';render();notify('Selecciona un proyecto');return}view=b.dataset.tab;search='';modal='';render();return}if(action==='open-project'){currentProjectId=id;currentSessionId=project().sessions.at(-1).id;view='detail';render();return}if(action==='open-create'){formType='libre';modal='create';render();return}if(action==='pick-type'){const saved=document.querySelector('#project-name')?.value||'';const goal=document.querySelector('#project-goal')?.value||'';formType=b.dataset.type;render();document.querySelector('#project-name').value=saved;document.querySelector('#project-goal').value=goal;return}if(action==='close-modal'){modal='';render();return}if(action==='change'){change(id,Number(b.dataset.delta));return}if(action==='reset-item'){resetItem(id);return}if(action==='undo'){undo();return}if(action==='redo'){redo();return}if(action==='add-item'){modal='add-item';render();return}if(action==='edit-item'){filterProject=id;modal='edit-item';render();return}if(action==='new-session'){modal='new-session';render();return}if(action==='edit-project'){modal='edit-project';render();return}if(action==='change-step'){modal='step';render();return}if(action==='detail-current'){view='detail';render();return}if(action==='history-current'){view='history';render();return}if(action==='export-json'){exportJSON();return}if(action==='import-json'){if(window.Android&&typeof window.Android.importBackup==='function')window.Android.importBackup();else imp.click();return}if(action==='export-csv'){exportCSV();return}if(action==='delete-item'){const p=project(),item=p.items.find(x=>x.id===filterProject);if(!item)return;if(p.items.length<2){notify('Conserva al menos un contador');return}if(p.sessions.some(s=>s.events.some(e=>e.itemId===item.id))){alert('Este contador ya tiene movimientos. Por seguridad, cambia el nombre en lugar de eliminarlo.');return}if(!confirm('¿Eliminar la categoría «'+item.name+'»?'))return;p.items=p.items.filter(x=>x.id!==item.id);modal='';persist();render();notify('Categoría eliminada');return}if(action==='delete-project'){const p=project();if(!p)return;if(!confirm('¿Eliminar «'+p.name+'» y todas sus sesiones e historial? Esta acción es irreversible.'))return;db.projects=db.projects.filter(x=>x.id!==p.id);currentProjectId=null;currentSessionId=null;view='home';modal='';persist();render();notify('Proyecto eliminado');return}if(action==='close-session'){const s=session();if(!s||s.closed)return;if(!confirm('¿Cerrar la sesión? Los conteos quedarán bloqueados. Puedes iniciar otra sesión.'))return;s.closedAt=new Date().toISOString();persist();render();notify('Sesión cerrada');return}});
app.addEventListener('change',e=>{if(e.target.id==='select-session'){currentSessionId=e.target.value;render()}else if(e.target.id==='darkCheck'){db.preferences.dark=e.target.checked;persist();render()}else if(e.target.id==='hapticCheck'){db.preferences.haptics=e.target.checked;persist();render()}});
app.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();const x=document.getElementById('search');x?.focus();x?.setSelectionRange(pos,pos)}});
app.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const values=new FormData(form);if(form.id==='create-form'){create()}else if(form.id==='item-form'){const name=String(values.get('name')||'').trim();if(!name)return;const p=project();const color=String(values.get('color')||COLORS[0]);if(!COLORS.includes(color))return notify('Selecciona un color válido');if(modal==='edit-item'){const it=p.items.find(x=>x.id===filterProject);it.name=name;it.color=color}else p.items.push({id:uid(),name,color});modal='';persist();render();notify('Categoría guardada')}else if(form.id==='session-form'){const p=project(),name=String(values.get('name')||'').trim();if(!name)return;const newS={id:uid(),name,startedAt:new Date().toISOString(),closedAt:null,events:[],undoStack:[],redoStack:[]};p.sessions.push(newS);currentSessionId=newS.id;modal='';persist();render();notify('Nueva sesión creada')}else if(form.id==='project-form'){const p=project();const name=String(values.get('name')||'').trim(),goal=Number(values.get('goal')||0);if(!name||!Number.isSafeInteger(goal)||goal<0||goal>100000000)return notify('Revisa el nombre y la meta');p.name=name;p.goal=goal;modal='';persist();render();notify('Proyecto actualizado')}else if(form.id==='step-form'){const step=Number(values.get('step'));if(!Number.isSafeInteger(step)||step<1||step>1000000)return notify('Paso inválido');db.preferences.step=step;modal='';persist();render();notify('Paso ajustado')}});
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'&&modal){modal='';render()}if(view==='detail'&&!modal){const p=project();if(!p||p.items.length!==1||session()?.closed)return;if(e.key==='+'||e.key==='ArrowUp'){e.preventDefault();change(p.items[0].id,1)}if(e.key==='-'||e.key==='ArrowDown'){e.preventDefault();change(p.items[0].id,-1)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}}});
render();})();
</script></body></html>
