name: Build NUMERA Android
on:
  push:
    branches: [numera-v1]
    paths:
      - 'numera-android/**'
      - '.github/workflows/numera-android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: numera-apk-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numera-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
      - name: Build
        working-directory: numera-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p releases
          cp numera-android/app/build/outputs/apk/debug/app-debug.apk releases/NUMERA-1.1.apk
          sha256sum releases/NUMERA-1.0.apk > releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NUMERA-1.1-APK
          path: releases/NUMERA-1.0.apk
