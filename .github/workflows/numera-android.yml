name: Build NUMERA Android
on:
  push:
    branches: [numera-v1]
    paths:
      - 'numera-android/**'
      - '.github/workflows/numera-android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: numera-15-ux-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numera-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
      - name: Check HTML application syntax and key UX controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('numera-android/app/src/main/assets/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Missing application script');
          new Function(html.slice(start + 8, end));
          for (const token of ['Administrar categorías','Ver sesiones','rename-session','move-item','goalMode','fractionalMode']) {
            if (!html.includes(token)) throw new Error('Missing: '+token);
          }
          console.log('Syntax OK, category and session UI present.');
          NODE
      - name: Build
        working-directory: numera-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p releases
          cp numera-android/app/build/outputs/apk/debug/app-debug.apk releases/NUMERA-1.5.apk
          sha256sum releases/NUMERA-1.5.apk > releases/SHA256SUMS.txt
          unzip -t releases/NUMERA-1.5.apk | tail -1
          unzip -p releases/NUMERA-1.5.apk assets/index.html | grep -q 'Administrar categorías'
          unzip -p releases/NUMERA-1.5.apk assets/index.html | grep -q 'Ver sesiones'
          unzip -l releases/NUMERA-1.5.apk | grep -E 'res/(mipmap|drawable)' > /dev/null || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: NUMERA-1.5-APK
          path: releases/NUMERA-1.5.apk
