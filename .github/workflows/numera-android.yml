name: Build NUMERA Android
on:
  push:
    branches: [numera-v1]
    paths:
      - 'numera-android/**'
      - '.github/workflows/numera-android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        working-directory: numera-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p releases
          cp numera-android/app/build/outputs/apk/debug/app-debug.apk releases/NUMERA-1.0.apk
          sha256sum releases/NUMERA-1.0.apk > releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NUMERA-APK
          path: releases/NUMERA-1.0.apk
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/
          git commit -m 'Publish NÚMERA APK' || exit 0
          git push
